shorten:
  system: You are a helpful assistant that edits emails.
  user: |
    Shorten the following email while keeping its original meaning, intent, and professional tone.
    Remove redundancy and unnecessary wording, but do not add new information or change facts.

    Return ONLY the shortened email text.

    Email:
    {selected_text}
lengthen:
  system: You are a helpful assistant that edits emails.
  user: |
    Lengthen the following email by adding clarity, detail, and smooth transitions while preserving its original meaning, intent, and professional tone.

    Rules:
    - Do NOT change the core message or request
    - Do NOT add new facts, names, or commitments
    - Keep the language professional and natural
    - Improve flow and completeness, not verbosity

    Return ONLY the revised email text.

    Email:
    {selected_text}
tone:
  system: You are a helpful assistant that edits emails.
  user: |
    Rewrite the following email using a {tone} tone while preserving the original meaning, intent, and key details.

    Rules:
    - Do NOT add or remove information
    - Do NOT change names, dates, or facts
    - Keep the email clear and natural
    - Ensure the tone matches "{tone}" consistently throughout

    Return ONLY the revised email text.

    Email:
    {selected_text}

judge:
  system: |
    You are an expert judge assessing the quality of a generated email.
    Your task is to evaluate the generated email relative to the original email
    using THREE dimensions:

    1. Faithfulness — how accurately the generated email preserves the original
       intent, meaning, and factual content, without introducing new assumptions.
    2. Completeness — whether the generated email includes all key requests,
       questions, constraints, and important details from the original.
    3. Overall Quality — a holistic score reflecting both faithfulness and
       completeness together, NOT style or tone.

  user: |
    ORIGINAL EMAIL:
    {selected_text}

    ------------------------------

    GENERATED EMAIL:
    {generated_text}

    ------------------------------

    Evaluate the GENERATED EMAIL using the following scales:

    ------------------------------
    FAITHFULNESS SCALE (1–5)
    ------------------------------
    5 — Fully faithful. Preserves original intent, meaning, and facts exactly.
    4 — Mostly faithful. Minor wording differences without material distortion.
    3 — Partially faithful. Core intent present, but some meaning is altered.
    2 — Largely unfaithful. Significant distortions or new assumptions introduced.
    1 — Unfaithful. Misrepresents or contradicts the original intent or facts.

    ------------------------------
    COMPLETENESS SCALE (1–5)
    ------------------------------
    5 — Fully complete. All key requests, questions, constraints, and details included.
    4 — Mostly complete. Minor details missing, no essential loss.
    3 — Partially complete. Some important elements missing or vague.
    2 — Largely incomplete. Many key elements missing or reduced.
    1 — Incomplete. Most essential information missing.

    ------------------------------
    OVERALL RATING (1–5)
    ------------------------------
    The overall rating MUST reflect a balanced judgment of BOTH faithfulness
    and completeness:

    - 5 — Fully faithful AND fully complete.
    - 4 — Mostly faithful AND mostly complete.
    - 3 — Mixed performance: partial faithfulness and/or completeness.
    - 2 — Major issues in faithfulness or completeness.
    - 1 — Fails on both faithfulness and completeness.

    The overall rating MUST NOT exceed either the faithfulness or completeness score.

    ------------------------------
    IMPORTANT RULES
    ------------------------------
    - Do NOT reward stylistic or tonal improvements if they change meaning.
    - Penalize added context, assumptions, timelines, or details not present
      in the original email.
    - Brevity is acceptable ONLY if all essential content is preserved.
    - Judge ONLY faithfulness and completeness (style is irrelevant).

    ------------------------------
    OUTPUT FORMAT (STRICT)
    ------------------------------
    Note: "rating" is the overall rating
    Return your evaluation in valid JSON ONLY:

    {{
      "faithfulness_rating": <integer from 1 to 5>,
      "completeness_rating": <integer from 1 to 5>,
      "rating": <integer from 1 to 5>,
      "explanation": "<concise justification referencing all ratings>"
    }}

generateLong:
  system: |
    You are a helpful assistant that generates synthetic emails.

  user: |
    Write 20 synthetic VERY LONG emails as JSONL (one JSON object per line).

    Output format (STRICT):
    - Each line must be a single valid JSON object: {{"id": integer, "sender": "<sender email address>", "subject": "<subject line>", "content": "<email body>"}}
    - No markdown, no arrays, no trailing commas

    Length:
    - Each email body must be VERY LONG (800–1400 words)

    Formatting (REQUIRED — make it messy):
    - Inconsistent spacing and indentation
    - Random blank lines
    - Mixed bullet styles (-, *, •)
    - Numbered lists that skip numbers
    - ALL CAPS emphasis in places
    - Awkward line breaks mid-sentence

    Content requirements:
    - Vary sender addresses (corporate, nonprofit, academic, personal)
    - Vary tone (formal, friendly, frustrated-but-professional, upbeat)
    - Each email must have a clear intent (request, update, escalation, review, planning)

    Output exactly 20 JSONL lines and nothing else.

